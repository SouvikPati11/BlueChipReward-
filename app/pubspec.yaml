name: bluechip_rewards
description: BlueChip Rewards — a premium earning & rewards platform.
publish_to: "none"
version: 1.5.0+13

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.5.6

  # Push notifications (FCM) + local display for foreground/data messages
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  # Local, on-device reminders (no server / no paid Firebase dependency)
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Auth
  google_sign_in: ^6.2.1

  # Ads — per-placement network selection (AdMob / AppLovin / Unity).
  # AdMob serves with public test units out of the box. AppLovin & Unity are
  # integrated but only initialise when their keys are supplied (see AppConfig
  # applovinSdkKey / unityGameId); until then those placements fall back to
  # AdMob test ads at runtime.
  google_mobile_ads: ^5.1.0
  applovin_max: ^3.9.1
  unity_ads_plugin: ^0.3.15

  # UX / utilities
  share_plus: ^12.0.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.3
  flutter_animate: ^4.5.0
  image_picker: ^1.1.2
  # Reinstall-stable Android device signal for referral fraud checks
  android_id: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config.env
    - assets/branding/logo.png
