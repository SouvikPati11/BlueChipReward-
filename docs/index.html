<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BlueChip Rewards — Legal</title>
<meta name="description" content="Legal pages for the BlueChip Rewards Android app: Privacy Policy and Terms of Service." />
<style>
  :root{--blue:#2563eb;--gold:#f5b301;--bg:#f6f8fc;--surface:#fff;--text:#0f172a;--muted:#475569;--border:#e2e8f0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:520px;width:100%;background:var(--surface);border:1px solid var(--border);
    border-radius:22px;padding:34px;text-align:center;box-shadow:0 12px 40px rgba(2,6,23,.06)}
  .logo{width:76px;height:76px;margin:0 auto 16px;border-radius:20px;
    background:linear-gradient(135deg,#1e3a8a,#2563eb,#3b82f6);display:grid;place-items:center;font-size:38px}
  h1{margin:0 0 6px;font-size:24px}
  p{color:var(--muted);margin:0 0 22px}
  .links{display:grid;gap:12px}
  a.btn{display:block;padding:15px 18px;border-radius:14px;text-decoration:none;font-weight:700;
    border:1px solid var(--border);color:var(--text);background:#fff}
  a.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  small{display:block;margin-top:18px;color:var(--muted)}
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1220;--surface:#0f1a2e;--text:#e5eefc;--muted:#94a3b8;--border:#1e293b}
    a.btn{background:#0f1a2e;color:var(--text)}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">💎</div>
    <h1>BlueChip Rewards</h1>
    <p>Legal &amp; policy documents</p>
    <div class="links">
      <a class="btn primary" href="./privacy.html">Privacy Policy</a>
      <a class="btn" href="./terms.html">Terms of Service</a>
    </div>
    <small>© 2026 BlueChip Rewards</small>
  </div>
</body>
</html>
