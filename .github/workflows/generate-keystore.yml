name: Generate Signing Keystore

# Creates an Android signing keystore in CI (no local tools needed) and stores
# it — plus its passwords and alias — DIRECTLY as encrypted repository secrets
# via the GitHub API. Nothing sensitive is ever printed to the log, the job
# summary, or an artifact. The only thing printed is the SHA-1 / SHA-256
# fingerprint, which is NOT secret and is meant to be registered with Google.
#
# ── One-time prerequisite ─────────────────────────────────────────────────
# The built-in GITHUB_TOKEN is not allowed to manage secrets, so you must
# provide a token once:
#   1. GitHub (any device) → your avatar → Settings → Developer settings →
#      Personal access tokens → Fine-grained tokens → Generate new token.
#   2. Repository access → Only select repositories → this repo.
#   3. Permissions → Repository permissions → "Secrets" → Read and write.
#   4. Generate, copy the token, and save it as a repo secret named
#      KEYSTORE_ADMIN_TOKEN (Settings → Secrets and variables → Actions).
# After this workflow succeeds you can delete KEYSTORE_ADMIN_TOKEN.
# ──────────────────────────────────────────────────────────────────────────
#
# Run: Actions → "Generate Signing Keystore" → Run workflow. When it finishes,
# the four ANDROID_* secrets already exist — you only copy the SHA-1 into
# Google Cloud. Safe to run on a public repository.

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "Key alias"
        required: true
        default: "upload"
      validity_days:
        description: "Validity in days (>= 10000 recommended for Play)"
        required: true
        default: "10000"

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore and store as repo secrets
        env:
          GH_TOKEN: ${{ secrets.KEYSTORE_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
          ALIAS: ${{ github.event.inputs.alias }}
          DAYS: ${{ github.event.inputs.validity_days }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing secret KEYSTORE_ADMIN_TOKEN. Create a fine-grained PAT with 'Secrets: Read and write' on this repo, save it as KEYSTORE_ADMIN_TOKEN, then re-run. See the comment at the top of this workflow file."
            exit 1
          fi

          # Strong random password. Register it as a masked value immediately so
          # it can never appear in the log even by accident, and keep it only in
          # shell memory (never echoed, never written to summary/artifact).
          PASS="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)"
          echo "::add-mask::$PASS"

          keytool -genkeypair -v \
            -keystore ks.jks -storetype JKS \
            -keyalg RSA -keysize 2048 -validity "$DAYS" \
            -alias "$ALIAS" \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=BlueChip Rewards, OU=Mobile, O=BlueChip, L=NA, S=NA, C=NA" >/dev/null 2>&1

          B64="$(base64 -w0 ks.jks)"
          echo "::add-mask::$B64"

          # Write the four secrets straight into the repo. gh reads each value
          # from stdin, so the value is never placed on a command line or logged.
          printf '%s' "$B64"   | gh secret set ANDROID_KEYSTORE_BASE64   --repo "$REPO"
          printf '%s' "$PASS"  | gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$REPO"
          printf '%s' "$ALIAS" | gh secret set ANDROID_KEY_ALIAS         --repo "$REPO"
          printf '%s' "$PASS"  | gh secret set ANDROID_KEY_PASSWORD      --repo "$REPO"

          # Print ONLY the fingerprints — these are not secret.
          echo "----- SHA fingerprints (NOT secret) — register the SHA-1 in Google Cloud -----"
          keytool -list -v -keystore ks.jks -alias "$ALIAS" -storepass "$PASS" \
            | grep -E "SHA1:|SHA256:"

          # Destroy the keystore file so it is never uploaded or cached anywhere.
          shred -u ks.jks 2>/dev/null || rm -f ks.jks

          {
            echo "## Keystore created and stored as encrypted repo secrets"
            echo ""
            echo "These four secrets were written automatically — their values were"
            echo "**never printed**:"
            echo "- \`ANDROID_KEYSTORE_BASE64\`"
            echo "- \`ANDROID_KEYSTORE_PASSWORD\`"
            echo "- \`ANDROID_KEY_ALIAS\`"
            echo "- \`ANDROID_KEY_PASSWORD\`"
            echo ""
            echo "Next: copy the **SHA-1** from the job log and register it in your"
            echo "Google Cloud **Android** OAuth client. Then run **Release Build**."
            echo ""
            echo "You may now delete the \`KEYSTORE_ADMIN_TOKEN\` secret."
          } >> "$GITHUB_STEP_SUMMARY"
