name: Generate Signing Keystore

# One-time helper for developers with no local tools. Creates an Android
# signing keystore in CI and prints everything you need to (a) register your
# app's SHA-1 with Google Sign-In and (b) store the keystore as GitHub secrets
# so the Release workflow can sign production builds.
#
# Run it from the GitHub UI: Actions -> "Generate Signing Keystore" -> Run
# workflow. Then follow the printed instructions. Delete this workflow run
# afterwards (three-dot menu -> Delete) so the printed values don't linger.
#
# ⚠️ IMPORTANT: the run log contains your signing key (base64 + password) so you
# can copy it into secrets from a phone. Run this ONLY on a PRIVATE repository,
# and delete the run as soon as you've saved the four secrets.

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "Key alias"
        required: true
        default: "upload"
      validity_days:
        description: "Validity in days (>= 10000 recommended for Play)"
        required: true
        default: "10000"

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          set -euo pipefail
          # Random strong passwords (same for store and key for simplicity).
          PASS="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)"
          ALIAS="${{ github.event.inputs.alias }}"
          DAYS="${{ github.event.inputs.validity_days }}"

          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity "$DAYS" \
            -alias "$ALIAS" \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=BlueChip Rewards, OU=Mobile, O=BlueChip, L=NA, S=NA, C=NA"

          B64="$(base64 -w0 upload-keystore.jks)"

          echo "SHA_FINGERPRINTS<<EOF" >> "$GITHUB_ENV"
          keytool -list -v -keystore upload-keystore.jks -alias "$ALIAS" -storepass "$PASS" \
            | grep -E "SHA1:|SHA256:" >> "$GITHUB_ENV" || true
          echo "EOF" >> "$GITHUB_ENV"

          {
            echo "## ✅ Keystore generated"
            echo ""
            echo "### 1) Add these GitHub secrets"
            echo "Repo → Settings → Secrets and variables → Actions → New repository secret:"
            echo ""
            echo "| Secret | Value |"
            echo "|---|---|"
            echo "| \`ANDROID_KEYSTORE_BASE64\` | (see the log line below) |"
            echo "| \`ANDROID_KEYSTORE_PASSWORD\` | \`$PASS\` |"
            echo "| \`ANDROID_KEY_ALIAS\` | \`$ALIAS\` |"
            echo "| \`ANDROID_KEY_PASSWORD\` | \`$PASS\` |"
            echo ""
            echo "### 2) Register these fingerprints in Google Cloud (for Google Sign-In)"
            echo '```'
            keytool -list -v -keystore upload-keystore.jks -alias "$ALIAS" -storepass "$PASS" \
              | grep -E "SHA1:|SHA256:" || true
            echo '```'
            echo ""
            echo "> After copying the values into secrets, **delete this workflow run**."
          } >> "$GITHUB_STEP_SUMMARY"

          # The base64 keystore is long; print it in a clearly marked block so you
          # can copy it into the ANDROID_KEYSTORE_BASE64 secret from any device.
          echo "----- BEGIN ANDROID_KEYSTORE_BASE64 (copy the single line below) -----"
          echo "$B64"
          echo "----- END ANDROID_KEYSTORE_BASE64 -----"

      - name: Upload keystore artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: upload-keystore.jks
          retention-days: 1
