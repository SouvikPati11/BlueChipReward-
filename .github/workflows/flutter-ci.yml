name: Flutter CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A recent stable whose generated Android Gradle scaffold is compatible with
  # current plugin versions (app_links 6.x, google_mobile_ads 5.x, etc.).
  FLUTTER_VERSION: "3.32.0"

defaults:
  run:
    working-directory: app

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format .
      - name: Analyze
        # Fail on real errors/warnings; style infos (const hints, etc.) are
        # non-blocking so CI stays green on cosmetic lints.
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test

  build:
    name: Build Android (APK + AAB)
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate & patch Android project
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          # Real Firebase config (base64 of google-services.json) activates push;
          # unset falls back to the committed placeholder so the build succeeds.
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          flutter create --platforms=android --org com.bluechip --project-name bluechip_rewards .
          python3 tool/patch_android.py

      - name: Debug signing certificate (for Google Sign-In registration)
        run: |
          echo "=================================================================="
          echo "DEBUG Google Sign-In requires an Android OAuth client for BOTH the"
          echo "package name AND this signature, in the SAME Google Cloud project"
          echo "that owns GOOGLE_WEB_CLIENT_ID. Missing it => ApiException: 10."
          echo "A certificate fingerprint is public, not a secret."
          echo "------------------------------------------------------------------"
          echo "Application type : Android"
          echo "Package name     : com.bluechip.bluechip_rewards"
          keytool -list -v -keystore android_keys/debug.keystore \
            -storepass android -alias androiddebugkey 2>/dev/null \
            | grep -E "SHA1:|SHA256:" || echo "debug.keystore not found"
          echo "------------------------------------------------------------------"
          echo "Register the SHA1 above at https://console.cloud.google.com/apis/credentials"
          echo "(Create Credentials -> OAuth client ID -> Android). Leave the"
          echo "existing release client (B4:54) and the Web client unchanged."
          echo "Details: app/android_keys/README.md"
          echo "=================================================================="

      - name: Write runtime config (.env)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          ADMOB_REWARDED_AD_UNIT: ${{ secrets.ADMOB_REWARDED_AD_UNIT }}
          ADMOB_BANNER_AD_UNIT: ${{ secrets.ADMOB_BANNER_AD_UNIT }}
          APPLOVIN_SDK_KEY: ${{ secrets.APPLOVIN_SDK_KEY }}
          UNITY_GAME_ID: ${{ secrets.UNITY_GAME_ID }}
        run: |
          cat > assets/config.env <<EOF
          SUPABASE_URL=${SUPABASE_URL:-https://YOUR-PROJECT-ref.supabase.co}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-YOUR-SUPABASE-ANON-KEY}
          GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID:-}
          ADMOB_REWARDED_AD_UNIT=${ADMOB_REWARDED_AD_UNIT:-ca-app-pub-3940256099942544/5224354917}
          ADMOB_BANNER_AD_UNIT=${ADMOB_BANNER_AD_UNIT:-ca-app-pub-3940256099942544/6300978111}
          APPLOVIN_SDK_KEY=${APPLOVIN_SDK_KEY:-}
          UNITY_GAME_ID=${UNITY_GAME_ID:-}
          EOF

      - name: Configuration status (no secret values printed)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_AD_UNIT: ${{ secrets.ADMOB_REWARDED_AD_UNIT }}
        run: |
          chk() { if [ -n "${2:-}" ]; then echo "  present  $1"; else echo "  MISSING  $1"; fi; }
          echo "Configuration status — secret VALUES are never printed, only present/missing:"
          echo "Required for the app to run (Supabase + email sign-in):"
          chk "SUPABASE_URL" "$SUPABASE_URL"
          chk "SUPABASE_ANON_KEY" "$SUPABASE_ANON_KEY"
          echo "Required for Google Sign-In to work on the phone:"
          chk "GOOGLE_WEB_CLIENT_ID" "$GOOGLE_WEB_CLIENT_ID"
          chk "ANDROID_KEYSTORE_BASE64 (stable signing SHA-1)" "$ANDROID_KEYSTORE_BASE64"
          echo "Optional — real ads (Google test ads are used until these are set):"
          chk "ADMOB_APP_ID" "$ADMOB_APP_ID"
          chk "ADMOB_REWARDED_AD_UNIT" "$ADMOB_REWARDED_AD_UNIT"

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify debug APK signer (must be the registered 03:8B keystore)
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          # SHA-1 of android_keys/debug.keystore (androiddebugkey), the cert
          # registered as the debug Android OAuth client for Google Sign-In.
          EXPECT="038BBE49DEB1FF6139F58BCB81AD14C2BBA92364"
          test -f "$APK" || { echo "::error::debug APK not found at $APK"; exit 1; }
          GOT="$(keytool -printcert -jarfile "$APK" 2>/dev/null \
            | grep -Ei 'SHA-?1:' | head -1 | sed -E 's/.*: *//; s/[: ]//g' | tr 'a-f' 'A-F')"
          echo "Built debug APK signer SHA-1 : $GOT"
          echo "Expected (debug keystore)    : $EXPECT"
          if [ "$GOT" != "$EXPECT" ]; then
            echo "::error::Debug APK is NOT signed with the committed debug keystore (03:8B) — Google Sign-In would fail with ApiException: 10."
            exit 1
          fi
          echo "OK: debug APK is signed with the registered debug keystore (03:8B:BE:49:...)."

      - name: Build release AAB (unsigned)
        run: flutter build appbundle --release
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bluechip-rewards-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: bluechip-rewards-aab
          path: app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
