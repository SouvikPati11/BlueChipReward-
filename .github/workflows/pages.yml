name: Deploy GitHub Pages

# OPTIONAL. The simplest way to publish the pages in docs/ needs NO workflow:
#   Settings -> Pages -> Build and deployment -> Source: "Deploy from a branch"
#   -> Branch: claude/bluechip-rewards-app-ayi2g7 -> Folder: /docs -> Save.
#
# This workflow is an alternative for those who prefer the "GitHub Actions"
# Pages source. It only works AFTER Pages has been enabled once in Settings
# (Source: GitHub Actions) — the built-in token cannot create the Pages site by
# itself. It is manual-only so it never auto-fails; run it from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload docs/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
