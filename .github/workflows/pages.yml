name: Deploy GitHub Pages

# Publishes the static legal pages in docs/ (Privacy Policy + Terms of Service)
# to GitHub Pages. `configure-pages` with enablement:true turns Pages on for the
# repo automatically, so no manual repo-settings toggle is required. This runs on
# the default branch, so it satisfies the github-pages environment by default.

on:
  push:
    branches: [claude/bluechip-rewards-app-ayi2g7]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload docs/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
